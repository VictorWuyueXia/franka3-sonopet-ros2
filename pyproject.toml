[tool.pytest.ini_options]
testpaths = ["ros2_ws/src"]
python_files = ["test_*.py"]
pythonpath = [
    "ros2_ws/src/fr3_sonopet_bringup/src",
    "ros2_ws/src/fr3_sonopet_microphone/src",
    "ros2_ws/src/fr3_sonopet_motion/src",
    "ros2_ws/src/fr3_sonopet_recording/src",
    "ros2_ws/src/fr3_sonopet_supervisor/src",
    "ros2_ws/src/fr3_sonopet_trajectory/src",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".reference",
    "ros2_ws/build",
    "ros2_ws/install",
    "ros2_ws/log",
    "ros2_ws/src/franka_ros2",
    "ros2_ws/src/realsense-ros",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
